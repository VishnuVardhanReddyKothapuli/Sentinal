services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_AI: ${BUILD_AI:-true}
    environment:
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      PORT: '8000'
      DATA_DIR: /app/data
      AUTO_CREATE_TABLES: 'false'
      CORS_ORIGINS: http://localhost:8080
      QDRANT_URL: ''
      QDRANT_LOCAL_PATH: /app/data/qdrant
      HF_HOME: /app/data/models
      ENABLE_AI_MODELS: ${ENABLE_AI_MODELS:-true}
      INFERENCE_CONCURRENCY: '1'
    volumes:
      - media_data:/app/data
    ports:
      - '127.0.0.1:8000:8000'
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media_data:
