name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lint + test deps (no heavy ML weights downloaded)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.110.0 "uvicorn[standard]==0.28.0" sqlalchemy==2.0.28 \
            pydantic==2.6.4 pydantic-settings==2.2.1 pillow==10.2.0 numpy==1.26.4 \
            python-multipart==0.0.9 python-dotenv==1.0.1 \
            pytest==8.1.1 httpx==0.27.0 ruff==0.3.4
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build
